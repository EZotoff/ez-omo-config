name: Cross-Platform CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install jq and python3 (macOS)
        if: runner.os == 'macOS'
        run: brew install jq python

      - name: Install jq and python3 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq python3

      - name: Run portable helper tests
        if: runner.os != 'Windows'
        run: bash tests/test_portable_helpers.sh

      - name: Run wisdom regression suite
        if: runner.os != 'Windows'
        run: bash scripts/wisdom/test-wisdom-compat.sh

      - name: Install.sh dry-run (Linux + macOS)
        if: runner.os != 'Windows'
        run: ./install.sh --dry-run

      - name: Windows - assert actionable WSL error
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set +e
          stderr_output=$(bash install.sh 2>&1 >/dev/null)
          exit_code=$?
          set -e
          echo "install.sh exit code: ${exit_code}"
          echo "$stderr_output" >&2
          if [[ "$exit_code" -eq 0 ]]; then
            echo "ERROR: install.sh succeeded on Windows; expected failure" >&2
            exit 1
          fi
          if ! echo "$stderr_output" | grep -q 'learn.microsoft.com/en-us/windows/wsl/install'; then
            echo "ERROR: stderr does not contain actionable WSL install URL" >&2
            exit 1
          fi
          echo "PASS: install.sh failed with actionable WSL error"
