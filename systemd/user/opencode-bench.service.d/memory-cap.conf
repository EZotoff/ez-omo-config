# Memory cap for the bench server (2026-09-30, operator-approved).
# The bench instance balloons under campaign load (observed 0.7→5.2 GB RSS in
# ~30 min), which pushed the whole host into swap and wedged the interactive
# servers (latency-death, no OOM kills — see kernel logs of 2026-09-29 boots).
# Cap it so a ballooning campaign contained-reclaims inside its own cgroup
# instead of thrashing the host. Applied live via `systemctl --user set-property`
# on 2026-09-30; this drop-in keeps it across unit reinstalls.
[Service]
MemoryHigh=4G
MemoryMax=6G
