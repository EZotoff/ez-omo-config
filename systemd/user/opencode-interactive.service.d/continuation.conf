# Continuation hooks: every stop/restart of this unit snapshots busy top-level
# sessions; every start resumes those captured within the TTL (default 1h).
# Opt-out of continuation for a specific restart:
#   ~/ez-omo-config/scripts/restart-with-continuation.sh --bare-restart --service opencode-interactive.service --url http://127.0.0.1:3030
[Service]
ExecStop=-%h/ez-omo-config/scripts/restart-with-continuation.sh hook-snapshot opencode-interactive.service http://127.0.0.1:3030 %h/.config/opencode/serve-interactive.env
ExecStartPost=-%h/ez-omo-config/scripts/restart-with-continuation.sh hook-resume opencode-interactive.service http://127.0.0.1:3030 %h/.config/opencode/serve-interactive.env
