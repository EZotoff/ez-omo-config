# Memory cap for OpenCode servers (2026-09-30, operator-approved).
# MemoryHigh throttles+reclaims instead of letting the known slow leak
# (sst/opencode#20695) grow unchecked between daily recycles. No MemoryMax:
# an OOM kill bypasses the ExecStop snapshot hooks and loses in-flight turns.
# Values chosen vs observed evening peaks (interactive 3.2G, headless 2.6G).
# Applied live via `systemctl --user set-property`; this drop-in persists it.
[Service]
MemoryHigh=6G
