# Recycle policy (wave A, 2026-10-16): RuntimeMaxSec is now a 24h HARD BACKSTOP
only. The active recycle trigger is the quiesce-gate timer
(opencode-recycle-gate.{service,timer}: RSS >= threshold AND zero busy sessions),
which recycles at the memory signal instead of interrupting busy sessions on a
fixed wall-clock schedule (fixed 6h recycles were the 2026-10-08/09 thrash
remedy; the 4x/day interruptions also manufactured most continuation false
positives — plan continuation-fp-wave-a.md). Keeper timer covers crash-class
failures.
[Service]
RuntimeMaxSec=86400
