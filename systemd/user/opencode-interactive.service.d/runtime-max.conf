# Daily recycle (2026-09-19) — tightened to 6h (2026-10-08/09: both servers regrow to 2-3GB within ~3h; 24h left them at 2.8-3.4GB through most of the day, feeding periodic swap-stall bursts): the interactive server is a long-lived
# monolith serving dozens of project directories; upstream per-instance leaks
# (sst/opencode#20695) accumulate ~9 GB RSS over weeks. RuntimeMaxSec forces a
# recycle; ExecStop continuation hooks snapshot and resume busy sessions, so it
# so the recycle is session-safe. Keeper timer covers crash-class failures.
[Service]
RuntimeMaxSec=21600
