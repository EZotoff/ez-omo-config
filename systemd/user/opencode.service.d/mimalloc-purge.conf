# Mitigate Bun native-allocator RSS retention (oven-sh/bun#21560): after JS GC,
# mimalloc pages sit in page caches and are purged lazily, so opencode serve RSS
# ratchets to the peak and stays there. MIMALLOC_PURGE_DELAY=0 forces eager
# purge — reduces (does not eliminate; libpas JS-heap backing is unaffected).
# Per upstream workaround discussed in anomalyco/opencode#20695/#51340.
# 2026-10-11, operator-approved.
[Service]
Environment=MIMALLOC_PURGE_DELAY=0
