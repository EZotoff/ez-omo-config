# Daily graceful recycle (2026-10-07): mirrors opencode-interactive.service.
# The headless agent server reached 3.7GB RSS in 26h during the 2026-10-06/07
# swap-thrash (upstream slow leak sst/opencode#20695 + supervisor reconcile
# hydration pressure). RuntimeMaxSec forces a daily restart; ExecStop
# continuation hooks snapshot and resume busy sessions, so the recycle is
# session-safe. Keeper/monitor tooling stays responsible for crash-class
# failures.
[Service]
RuntimeMaxSec=21600
